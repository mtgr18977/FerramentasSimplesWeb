<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Editor Markdown – Ferramentas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="site-logo">Ferramentas</a>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <a href="index.html" class="back-link">Início</a>
      <h1>Editor Markdown</h1>
    </div>

    <div class="editor-wrapper">
      <div class="editor-pane">
        <h2>Editor</h2>
        <textarea class="editor" id="editor" spellcheck="false" placeholder="# Olá!&#10;&#10;Comece a escrever em Markdown..."></textarea>
      </div>
      <div class="editor-pane">
        <h2>Prévia</h2>
        <div class="preview" id="preview"></div>
      </div>
    </div>

    <div class="button-row mt-2">
      <button onclick="clearEditor()" class="btn-ghost">Limpar</button>
      <button onclick="saveEditor()">Salvar .md</button>
      <input class="file-input" type="file" accept=".md,.txt" id="fileInput" onchange="loadFile(event)">
      <button onclick="document.getElementById('fileInput').click()" class="btn-ghost">Carregar arquivo</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');

    marked.setOptions({ breaks: true, gfm: true });

    function updatePreview() {
      preview.innerHTML = DOMPurify.sanitize(marked.parse(editor.value));
    }

    editor.addEventListener('input', updatePreview);

    editor.addEventListener('scroll', function () {
      const scale = this.scrollHeight - this.clientHeight;
      if (scale <= 0) return;
      const pct = this.scrollTop / scale;
      const previewScale = preview.scrollHeight - preview.clientHeight;
      preview.scrollTop = pct * previewScale;
    });

    function clearEditor() {
      if (editor.value && !confirm('Descartar o conteúdo atual?')) return;
      editor.value = '';
      preview.innerHTML = '';
    }

    function saveEditor() {
      const blob = new Blob([editor.value], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.download = 'documento.md';
      a.href = url;
      a.click();
      URL.revokeObjectURL(url);
    }

    function loadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        editor.value = e.target.result;
        updatePreview();
      };
      reader.readAsText(file);
      event.target.value = '';
    }
  </script>
</body>
</html>
