<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas – Ferramentas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="index.html" class="site-logo">Ferramentas</a>
    </div>
  </header>

  <div class="container">
    <div class="page-header">
      <a href="index.html" class="back-link">Início</a>
      <h1>Notas</h1>
    </div>

    <div class="card">
      <div class="form-group">
        <label for="noteInput">Nova nota <span class="text-muted text-sm">(Ctrl+Enter para salvar)</span></label>
        <textarea id="noteInput" placeholder="Digite sua nota..."></textarea>
      </div>
      <div class="button-row">
        <button id="saveBtn" class="btn-primary">Salvar</button>
        <button id="clearBtn" class="btn-ghost">Limpar tudo</button>
      </div>
    </div>

    <ul class="note-list" id="noteList"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'notes_v2';

    function loadNotes() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function persistNotes(notes) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    }

    function renderNotes() {
      const notes = loadNotes();
      const list = document.getElementById('noteList');
      list.innerHTML = '';

      notes.forEach((text, index) => {
        const li = document.createElement('li');

        const span = document.createElement('span');
        span.className = 'note-text';
        span.textContent = text;

        const del = document.createElement('button');
        del.className = 'note-delete';
        del.setAttribute('aria-label', 'Excluir nota');
        del.textContent = '×';
        del.addEventListener('click', () => {
          const current = loadNotes();
          current.splice(index, 1);
          persistNotes(current);
          renderNotes();
        });

        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    document.getElementById('saveBtn').addEventListener('click', () => {
      const input = document.getElementById('noteInput');
      const text = input.value.trim();
      if (!text) return;

      const notes = loadNotes();
      notes.push(text);
      persistNotes(notes);
      input.value = '';
      renderNotes();
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!confirm('Tem certeza que deseja apagar todas as notas?')) return;
      localStorage.removeItem(STORAGE_KEY);
      renderNotes();
    });

    document.getElementById('noteInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        document.getElementById('saveBtn').click();
      }
    });

    renderNotes();
  </script>
</body>
</html>
